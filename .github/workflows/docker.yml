# Verify the Docker image builds and docker-compose.yml is valid.
# Does not run the bot or API (no Discord token / long-lived services).
name: docker

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: discord-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Stub .env for compose validation
        run: |
          printf '%s\n' \
            'DISCORD_TOKEN=ci' \
            'HOST=0.0.0.0' \
            'PORT=9999' \
            'API_TOKEN=ci' \
            > .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
