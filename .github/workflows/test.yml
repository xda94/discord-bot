# Runs the pytest suite on every push and pull request so a regression
# can never silently merge. The whole suite takes ~4s locally; on a
# GitHub-hosted runner expect roughly 30-60s including dependency install
# (which is cached after the first run).
name: tests

on:
  push:
    branches: ["**"]   # run on every branch push
  pull_request:        # and on every PR
  workflow_dispatch:   # plus a manual "Run workflow" button in the UI

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the Pi's interpreter so subtle 3.13-vs-3.12 differences
          # (e.g. typing, asyncio) are caught here, not in production.
          python-version: "3.13"
          # Caches the pip download dir keyed on the requirements files,
          # so the second run onwards skips re-downloading wheels.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v
